# One-off: build the Community over Code 2026 native http image (amd64 +
# arm64) with HTTP security off and publish it as :coc2026-native-http.
# Spring AOT fixes the security filter chain when the binary is compiled, so
# HTTP_SECURITY_ENABLED has to be set for the build; at run time it is ignored.
# Steps mirror release-publish.yml's publish-native / publish-native-manifests.
name: coc2026 native images

on:
  push:
    branches: [coc2026-native-images]

jobs:
  native:
    name: Native (${{ matrix.profile }}, ${{ matrix.arch.name }})
    runs-on: ${{ matrix.arch.runs-on }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        profile: [http]
        arch:
          - { name: amd64, runs-on: ubuntu-latest }
          - { name: arm64, runs-on: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - name: Set up GraalVM JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'gradle'
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Build native image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/solr-mcp:coc2026-native-${{ matrix.profile }}-unsecured-${{ matrix.arch.name }}
          PROFILE: ${{ matrix.profile }}
          HTTP_SECURITY_ENABLED: "false"
        run: ./gradlew bootBuildImage -Pnative "-Pprofile=${PROFILE}" "--imageName=${IMAGE_NAME}" --no-daemon
      - name: Push
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/solr-mcp:coc2026-native-${{ matrix.profile }}-unsecured-${{ matrix.arch.name }}
        run: docker push "${IMAGE_NAME}"

  manifests:
    name: Assemble multi-arch tags
    runs-on: ubuntu-latest
    needs: native
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Create manifest lists
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          BASE="ghcr.io/${REPO_OWNER}/solr-mcp"
          docker buildx imagetools create --tag "${BASE}:coc2026-native-http" \
            "${BASE}:coc2026-native-http-unsecured-amd64" \
            "${BASE}:coc2026-native-http-unsecured-arm64"
          docker buildx imagetools inspect "${BASE}:coc2026-native-http"
